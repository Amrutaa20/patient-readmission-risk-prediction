<header class="topbar">
  <form class="topbar-search" (ngSubmit)="submitSearch()">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="search"
      placeholder="Search saved predictions by ID or dataset row"
      [(ngModel)]="searchQuery"
      name="searchQuery"
      aria-label="Search"
    />
  </form>

  <div class="topbar-actions">
    <button class="notification-btn" aria-label="Notifications unavailable" title="Notifications are not configured" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>

    <div class="user-profile">
      <div class="user-avatar">
        <img
          src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=100&auto=format&fit=crop&q=80"
          alt="Dr. Sharma"
          (error)="$any($event.target).style.display = 'none'"
        />
        <span class="avatar-fallback">DS</span>
      </div>
      <div class="user-info">
        <span class="user-name">Dr. Sharma</span>
        <span class="user-role">Doctor</span>
      </div>
    </div>
  </div>
</header>
